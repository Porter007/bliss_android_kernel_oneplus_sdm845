name: OnePlus 6T Kernel Build (Android R)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4

      - name: Mark workspace as safe directory for Git
        run: sudo git config --system --add safe.directory /github/workspace

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates ccache curl flex git kmod libssl-dev libncurses-dev python3 python3-pip unzip wget zip zlib1g-dev

      - name: Download AOSP Clang 12
        run: |
          wget https://releases.llvm.org/12.0.0/clang+llvm-12.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          tar -xf clang+llvm-12.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          mv clang+llvm-12.0.0-x86_64-linux-gnu-ubuntu-20.04 clang

      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_PATH: ${{ github.workspace }}/clang/bin
        run: |
          export PATH=$CLANG_PATH:$PATH
          # Replace with actual defconfig present in your source, e.g., sdm845_defconfig or bliss_defconfig
          make O=out ARCH=arm64 bliss_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel Image
          path: out/arch/arm64/boot/Image.gz-dtb
