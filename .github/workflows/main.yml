name: Kernel Build with mcd-clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Mark workspace as safe directory for Git
        run: sudo git config --system --add safe.directory /github/workspace

      - name: Download and Extract mcd-clang Toolchain
        run: |
          # IMPORTANT: Replace this URL with a valid mcd-clang tarball from the releases page:
          # https://github.com/mcdachpappe/mcd-clang/releases
          wget https://github.com/mcdachpappe/mcd-clang/releases/download/v13.0.0/mcd-clang.tar.xz
          mkdir mcd-clang
          tar -xf mcd-clang.tar.xz -C mcd-clang --strip-components=1

      - name: Set up MemKernel as module (if needed)
        run: |
          curl -LSs "https://raw.githubusercontent.com/Porter007/MemKernel/main/kernel/setup.sh" | bash -s M fajita

      - name: Build Kernel with mcd-clang
        env:
          PATH: ${{ github.workspace }}/mcd-clang/bin:${PATH}
          CC: ${{ github.workspace }}/mcd-clang/bin/clang
          CXX: ${{ github.workspace }}/mcd-clang/bin/clang++
          LD_LIBRARY_PATH: ${{ github.workspace }}/mcd-clang/lib:${LD_LIBRARY_PATH}
          ARCH: arm64
          SUBARCH: arm64
        run: |
          make O=out bliss_defconfig
          make -j$(nproc) O=out CC=clang ARCH=arm64

      - name: Upload Kernel and Module
        uses: actions/upload-artifact@v4
        with:
          name: moduleandkernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            ./out/drivers/memkernel/memkernel.ko
