name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Mark workspace as safe directory for Git
        run: sudo git config --system --add safe.directory /github/workspace

      # Download Proton Clang
      - name: Set up Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Set up MemKernel as a module (M-OUT) with specified name
        run: |
          curl -LSs "https://raw.githubusercontent.com/Porter007/MemKernel/main/kernel/setup.sh" | bash -s M fajita

      # Kernel build step using Proton Clang
      - name: Android kernel build
        uses: lemniskett/android-kernel-actions@master
        id: build
        with:
          arch: arm64
          compiler: proton-clang/master
          clang_path: ${{ github.workspace }}/clang
          defconfig: bliss_defconfig           # Adjust if needed
          image: Image.gz-dtb

      - name: Upload Kernel and Module
        uses: actions/upload-artifact@v4
        with:
          name: moduleandkernel
          path: |
            ${{ steps.build.outputs.outfile }}
            ./out/drivers/memkernel/memkernel.ko
